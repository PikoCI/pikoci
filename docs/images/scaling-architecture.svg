<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 395" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#83769C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="395" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Phase 1: Single binary -->
  <rect x="20" y="20" width="240" height="340" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="48" text-anchor="middle" font-weight="700" font-size="14" fill="#1D2B53">Phase 1: Single binary</text>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#83769C">In-memory, zero deps</text>

  <rect x="55" y="90" width="170" height="120" rx="6" fill="#e8f4ff" stroke="#29ADFF" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="140" y="112" text-anchor="middle" font-size="11" fill="#29ADFF" font-weight="600">pikoci server --run-worker</text>

  <rect x="75" y="125" width="130" height="32" rx="4" fill="#29ADFF" stroke="none"/>
  <text x="140" y="146" text-anchor="middle" fill="#fff" font-weight="600">Server</text>

  <rect x="75" y="168" width="130" height="32" rx="4" fill="#00A83A" stroke="none"/>
  <text x="140" y="189" text-anchor="middle" fill="#fff" font-weight="600">Worker</text>

  <rect x="85" y="240" width="110" height="32" rx="4" fill="#FFA300" stroke="none"/>
  <text x="140" y="261" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">In-memory DB</text>

  <line x1="140" y1="210" x2="140" y2="240" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: SQLite -->
  <rect x="290" y="20" width="240" height="340" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="410" y="48" text-anchor="middle" font-weight="700" font-size="14" fill="#1D2B53">Phase 2: SQLite</text>
  <text x="410" y="66" text-anchor="middle" font-size="11" fill="#83769C">Persistent, single machine</text>

  <rect x="325" y="90" width="170" height="120" rx="6" fill="#e8f4ff" stroke="#29ADFF" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#29ADFF" font-weight="600">pikoci server --run-worker</text>

  <rect x="345" y="125" width="130" height="32" rx="4" fill="#29ADFF" stroke="none"/>
  <text x="410" y="146" text-anchor="middle" fill="#fff" font-weight="600">Server</text>

  <rect x="345" y="168" width="130" height="32" rx="4" fill="#00A83A" stroke="none"/>
  <text x="410" y="189" text-anchor="middle" fill="#fff" font-weight="600">Worker</text>

  <rect x="355" y="240" width="110" height="32" rx="4" fill="#FFA300" stroke="none"/>
  <text x="410" y="261" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">SQLite file</text>

  <line x1="410" y1="210" x2="410" y2="240" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Distributed -->
  <rect x="560" y="20" width="240" height="340" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="680" y="48" text-anchor="middle" font-weight="700" font-size="14" fill="#1D2B53">Phase 3: Distributed</text>
  <text x="680" y="66" text-anchor="middle" font-size="11" fill="#83769C">Separate workers, shared DB</text>

  <rect x="625" y="85" width="110" height="32" rx="4" fill="#29ADFF" stroke="none"/>
  <text x="680" y="106" text-anchor="middle" fill="#fff" font-weight="600">Server</text>

  <!-- Workers with gRPC badge -->
  <rect x="580" y="160" width="96" height="40" rx="4" fill="#00A83A" stroke="none"/>
  <text x="628" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">Worker 1</text>
  <rect x="600" y="183" width="56" height="14" rx="3" fill="rgba(255,255,255,0.25)" stroke="none"/>
  <text x="628" y="194" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">gRPC</text>

  <rect x="692" y="160" width="96" height="40" rx="4" fill="#00A83A" stroke="none"/>
  <text x="740" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">Worker 2</text>
  <rect x="712" y="183" width="56" height="14" rx="3" fill="rgba(255,255,255,0.25)" stroke="none"/>
  <text x="740" y="194" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">gRPC</text>

  <rect x="636" y="215" width="96" height="40" rx="4" fill="#00A83A" stroke="none"/>
  <text x="684" y="231" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">Worker N</text>
  <rect x="656" y="238" width="56" height="14" rx="3" fill="rgba(255,255,255,0.25)" stroke="none"/>
  <text x="684" y="249" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">gRPC</text>

  <!-- Connections -->
  <line x1="655" y1="117" x2="635" y2="160" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="705" y1="117" x2="735" y2="160" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="117" x2="684" y2="215" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Database -->
  <rect x="620" y="280" width="120" height="32" rx="4" fill="#FFA300" stroke="none"/>
  <text x="680" y="301" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">PostgreSQL</text>

  <line x1="680" y1="255" x2="680" y2="280" stroke="#83769C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows between phases -->
  <text x="268" y="190" text-anchor="middle" font-size="18" fill="#83769C">&#x2192;</text>
  <text x="538" y="190" text-anchor="middle" font-size="18" fill="#83769C">&#x2192;</text>

  <!-- Legend -->
  <rect x="290" y="330" width="12" height="12" rx="2" fill="#29ADFF"/>
  <text x="308" y="341" font-size="11" fill="#5F574F">Server</text>
  <rect x="360" y="330" width="12" height="12" rx="2" fill="#00A83A"/>
  <text x="378" y="341" font-size="11" fill="#5F574F">Worker</text>
  <rect x="430" y="330" width="12" height="12" rx="2" fill="#FFA300"/>
  <text x="448" y="341" font-size="11" fill="#5F574F">Database</text>
</svg>
